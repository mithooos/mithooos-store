<div class="main-wrap">
  <header class="topbar">
    <div class="topbar-left"><div class="page-title">Orders</div><div style="font-size:.75rem;color:var(--muted)">Manage and track customer orders</div></div>
    <div class="topbar-right">
      <button class="btn btn-ghost btn-sm" onclick="exportOrders()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export</button>
      <div class="admin-avatar">A</div>
    </div>
  </header>

  <main class="content">
    <!-- Status tabs -->
    <div style="display:flex;gap:.375rem;margin-bottom:1.25rem;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" id="tab-all" onclick="filterByStatus('all',this)">All Orders <span style="background:rgba(255,255,255,.25);border-radius:10px;padding:1px 6px;font-size:.65rem">—</span></button>
      <button class="btn btn-ghost btn-sm" id="tab-pending" onclick="filterByStatus('pending',this)">Pending <span style="background:var(--border);border-radius:10px;padding:1px 6px;font-size:.65rem">—</span></button>
      <button class="btn btn-ghost btn-sm" id="tab-processing" onclick="filterByStatus('processing',this)">Processing <span style="background:var(--border);border-radius:10px;padding:1px 6px;font-size:.65rem">—</span></button>
      <button class="btn btn-ghost btn-sm" id="tab-shipped" onclick="filterByStatus('shipped',this)">Shipped <span style="background:var(--border);border-radius:10px;padding:1px 6px;font-size:.65rem">—</span></button>
      <button class="btn btn-ghost btn-sm" id="tab-delivered" onclick="filterByStatus('delivered',this)">Delivered <span style="background:var(--border);border-radius:10px;padding:1px 6px;font-size:.65rem">—</span></button>
      <button class="btn btn-ghost btn-sm" id="tab-cancelled" onclick="filterByStatus('cancelled',this)">Cancelled <span style="background:var(--border);border-radius:10px;padding:1px 6px;font-size:.65rem">—</span></button>
    </div>
    
    <div style="display:flex;gap:.375rem;margin-bottom:1.25rem;flex-wrap:wrap">
      <span style="font-size: 0.8rem; font-weight: 600; align-self: center; margin-right: 0.5rem; color: var(--muted)">Payment:</span>
      <div style="display:flex;gap:var(--space-2)">
        <button class="btn btn-primary btn-sm" id="paytab-all" onclick="filterByPaymentStatus('all', 'all', this)">All Payments</button>
        <button class="btn btn-ghost btn-sm" id="paytab-pending" onclick="filterByPaymentStatus('pending', 'cod', this)">Pending COD</button>
        <button class="btn btn-ghost btn-sm" id="paytab-completed" onclick="filterByPaymentStatus('completed', 'all', this)">Confirmed/Completed</button>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="toolbar-search"><svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" width="15" height="15"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="search" placeholder="Order #, customer email…" oninput="searchOrders(this.value)"></div>
        <input type="date" class="form-control" style="width:140px;height:34px;font-size:.78rem" title="From date">
        <input type="date" class="form-control" style="width:140px;height:34px;font-size:.78rem" title="To date">
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Order #</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

</div>

<!-- ORDER DETAIL MODAL -->
<div class="modal-overlay" id="orderModal">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <span class="modal-title" id="orderModalTitle">Order Details</span>
      <button class="modal-close" onclick="closeModal('orderModal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="orderModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('orderModal')">Close</button>
      <button class="btn btn-primary" onclick="printInvoice()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print Invoice</button>
    </div>
  </div>
</div>

<!-- Dedicated A4 invoice surface. It is populated from the selected order and
  is the only surface displayed by the browser's print media query. -->
<article id="printInvoice" class="print-invoice" aria-label="Order invoice"></article>

<div class="toast-container" id="toastContainer"></div>
<script src="../js/admin.js?v=20260916"></script>
<script>
'use strict';

/* ══════════════════════════════════════════
   ADMIN ORDERS — Wired to the real backend
   (GET/PUT /admin/orders via AdminAPI)
   ══════════════════════════════════════════ */

let currentPage = 1;
const urlParams = new URLSearchParams(window.location.search);
let currentStatus = urlParams.get('status') || 'all';
let currentPaymentStatus = urlParams.get('payment_status') || 'all';
let currentPaymentMethod = urlParams.get('payment_method') || 'all';
let currentSearch = urlParams.get('search') || '';
let statusCounts = {};

async function loadOrders() {
  const tbody = document.getElementById('ordersBody');
  tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--muted)">Loading…</td></tr>`;

  const params = new URLSearchParams({ page: currentPage, limit: 20 });
  if (currentStatus !== 'all') params.set('status', currentStatus);
  if (currentPaymentStatus !== 'all') params.set('payment_status', currentPaymentStatus);
  if (currentPaymentMethod !== 'all') params.set('payment_method', currentPaymentMethod);
  if (currentSearch) params.set('search', currentSearch);

  try {
    const res = await AdminAPI.get('/orders?' + params.toString());
    if (!res.success) throw new Error(res.message || 'Failed to load orders');
    renderOrders(res.data || []);
    renderPagination(res.pagination);
    updateTabCounts(res.pagination, res.status_counts);
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--error)">Could not load orders.</td></tr>`;
    showToast(err.message || 'Could not load orders.', 'error');
  }
}

function renderOrders(rows) {
  const tbody = document.getElementById('ordersBody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--muted)">No orders found.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(o => {
    const statusLabel = o.order_status.charAt(0).toUpperCase() + o.order_status.slice(1);
    return `<tr>
      <td><strong>${escapeHtml(o.order_number)}</strong></td>
      <td><div class="td-name">${escapeHtml(o.first_name + ' ' + o.last_name)}</div><div class="td-muted">${escapeHtml(o.email)}</div></td>
      <td style="font-size:.78rem">${fmt.date(o.created_at)}</td>
      <td style="text-align:center;font-weight:600">${o.item_count}</td>
      <td style="font-weight:700">${fmt.currency(o.total_amount)}</td>
      <td style="font-size:.75rem">
        <div style="text-transform:capitalize;font-weight:600">${escapeHtml(o.payment_method || '—')}</div>
        <div style="font-size:.65rem;color:${o.payment_status === 'completed' ? '#10B981' : (o.payment_status === 'failed' ? '#EF4444' : '#F59E0B')}">${escapeHtml((o.payment_status || 'pending').toUpperCase())}</div>
      </td>
      <td><span class="badge badge-${o.order_status}">${statusLabel}</span></td>
      <td>
        <div class="td-actions">
          <button class="btn btn-outline btn-sm" onclick="viewOrder(${o.order_id})">View</button>
          <select class="form-control" style="width:110px;height:28px;font-size:.7rem;padding:.2rem .5rem" onchange="updateStatus(${o.order_id},this.value);this.value=''">
            <option value="">Update…</option>
            <option value="confirmed">Confirmed</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <select class="form-control" style="width:110px;height:28px;font-size:.7rem;padding:.2rem .5rem;margin-top:.25rem" onchange="updatePaymentStatus(${o.order_id},this.value);this.value=''">
            <option value="">Pay Status…</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
            <option value="refunded">Refunded</option>
          </select>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function renderPagination(pagination) {
  const el = document.getElementById('pagination');
  if (!el || !pagination) return;
  const { current_page, last_page } = pagination;
  if (last_page <= 1) { el.innerHTML = ''; return; }
  let html = `<button class="btn btn-ghost btn-sm" ${current_page<=1?'disabled':''} onclick="goToPage(${current_page-1})">Prev</button>`;
  html += `<span style="font-size:.78rem;padding:0 .75rem;color:var(--muted)">Page ${current_page} of ${last_page}</span>`;
  html += `<button class="btn btn-ghost btn-sm" ${current_page>=last_page?'disabled':''} onclick="goToPage(${current_page+1})">Next</button>`;
  el.innerHTML = html;
}

function invoiceAddress(value) {
  if (!value) return '<span class="invoice-muted">Not provided</span>';
  if (typeof value === 'string') {
    try { value = JSON.parse(value); }
    catch { return escapeHtml(value); }
  }
  if (typeof value !== 'object') return escapeHtml(String(value));
  return [
    value.full_name,
    value.street_address,
    value.apartment_suite,
    [value.city, value.state, value.postal_code].filter(Boolean).join(', '),
    value.country
  ].filter(Boolean).map(escapeHtml).join('<br>');
}

function invoiceDate(value) {
  return value ? fmt.date(value) : '—';
}

function renderInvoice(o) {
  const items = o.items || [];
  const shippingAddress = o.shipping_address || o.shippingAddress;
  const billingAddress = o.billing_address || o.billingAddress;
  const customerName = [o.first_name, o.last_name].filter(Boolean).join(' ') || 'Customer';
  const subtotal = Number(o.subtotal || 0);
  const discount = Number(o.discount_amount || 0);
  const shipping = Number(o.shipping_cost || 0);
  const tax = Number(o.tax || 0);
  const total = Number(o.total_amount || 0);
  const paymentStatus = String(o.payment_status || 'pending');
  const orderStatus = String(o.order_status || 'pending');
  const statusLabel = value => value.charAt(0).toUpperCase() + value.slice(1);

  document.getElementById('printInvoice').innerHTML = `
    <header class="invoice-header">
      <div class="invoice-brand">
        <div class="invoice-logo">M</div>
        <div><strong>MITHOOOS</strong><span>Sindh Ki Khushboo</span></div>
      </div>
      <div class="invoice-heading"><div>INVOICE</div><span>Order document</span></div>
    </header>
    <section class="invoice-meta-grid">
      <div><span class="invoice-label">Invoice Number</span><strong>${escapeHtml(o.order_number || '—')}</strong></div>
      <div><span class="invoice-label">Order Number</span><strong>${escapeHtml(o.order_number || '—')}</strong></div>
      <div><span class="invoice-label">Invoice Date</span><strong>${invoiceDate(new Date().toISOString())}</strong></div>
      <div><span class="invoice-label">Order Date</span><strong>${invoiceDate(o.created_at)}</strong></div>
    </section>
    <section class="invoice-parties">
      <div class="invoice-info-block"><span class="invoice-label">From</span><strong>Mithooos</strong><p>Sindh Ki Khushboo</p><p class="invoice-muted">Business address and contact details are not configured.</p></div>
      <div class="invoice-info-block"><span class="invoice-label">Bill To</span><strong>${escapeHtml(customerName)}</strong><p>${escapeHtml(o.email || '—')}</p><p>${escapeHtml(o.phone || '—')}</p><p>${invoiceAddress(billingAddress || shippingAddress)}</p></div>
      <div class="invoice-info-block"><span class="invoice-label">Ship To</span><strong>${escapeHtml(customerName)}</strong><p>${invoiceAddress(shippingAddress)}</p></div>
    </section>
    <section class="invoice-section">
      <table class="invoice-items"><thead><tr><th>Product</th><th>SKU</th><th class="invoice-number">Qty</th><th class="invoice-number">Unit Price</th><th class="invoice-number">Total</th></tr></thead>
      <tbody>${items.map(item => `<tr><td><strong>${escapeHtml(item.product_name || 'Product')}</strong></td><td>${escapeHtml(item.product_sku || '—')}</td><td class="invoice-number">${Number(item.quantity || 0)}</td><td class="invoice-number">${fmt.currency(item.price_at_purchase || 0)}</td><td class="invoice-number">${fmt.currency(item.item_total || (Number(item.price_at_purchase || 0) * Number(item.quantity || 0)))}</td></tr>`).join('')}</tbody></table>
    </section>
    <section class="invoice-lower-grid">
      <div class="invoice-info-block"><span class="invoice-label">Payment</span><p><strong>Method:</strong> ${escapeHtml(o.payment_method || '—')}</p><p><strong>Status:</strong> <span class="invoice-status invoice-status-${escapeHtml(paymentStatus)}">${escapeHtml(statusLabel(paymentStatus))}</span></p></div>
      <div class="invoice-info-block"><span class="invoice-label">Shipping & Status</span><p><strong>Method:</strong> ${escapeHtml(o.shipping_method || '—')}</p><p><strong>Order status:</strong> <span class="invoice-status invoice-status-${escapeHtml(orderStatus)}">${escapeHtml(statusLabel(orderStatus))}</span></p><p><strong>Tracking:</strong> ${escapeHtml(o.tracking_number || 'Not available')}</p></div>
      <div class="invoice-totals"><div><span>Subtotal</span><strong>${fmt.currency(subtotal)}</strong></div><div><span>Discount</span><strong>${fmt.currency(discount)}</strong></div><div><span>Shipping</span><strong>${fmt.currency(shipping)}</strong></div><div><span>Tax</span><strong>${fmt.currency(tax)}</strong></div><div class="invoice-grand-total"><span>Grand Total</span><strong>${fmt.currency(total)}</strong></div></div>
    </section>
    <footer class="invoice-footer"><strong>Thank you for shopping with Mithooos.</strong><span>Mithooos · Sindh Ki Khushboo</span><small>This is a computer-generated invoice.</small></footer>`;
}
function goToPage(p) { if (p < 1) return; currentPage = p; loadOrders(); }

function updateTabCounts(pagination, statusCounts) {
  const allCountEl = document.querySelector('#tab-all span');
  if (allCountEl && pagination) allCountEl.textContent = pagination.total;

  const counts = {};
  (statusCounts || []).forEach(row => { counts[row.order_status] = parseInt(row.cnt, 10); });
  ['pending','processing','shipped','delivered','cancelled'].forEach(status => {
    const el = document.querySelector(`#tab-${status} span`);
    if (el) el.textContent = counts[status] || 0;
  });
}

function filterByStatus(status, btnEl) {
  currentStatus = status;
  currentPage = 1;
  document.querySelectorAll('[id^="tab-"]').forEach(b => {
    b.classList.remove('btn-primary');
    b.classList.add('btn-ghost');
    b.querySelector('span').style.background = 'var(--border)';
  });
  if (btnEl) {
    btnEl.classList.remove('btn-ghost');
    btnEl.classList.add('btn-primary');
    btnEl.querySelector('span').style.background = 'rgba(255,255,255,.25)';
  }
  loadOrders();
}

function filterByPaymentStatus(status, method, btnEl) {
  currentPaymentStatus = status;
  currentPaymentMethod = method;
  currentPage = 1;
  document.querySelectorAll('[id^="paytab-"]').forEach(b => {
    b.classList.remove('btn-primary');
    b.classList.add('btn-ghost');
  });
  if (btnEl) {
    btnEl.classList.remove('btn-ghost');
    btnEl.classList.add('btn-primary');
  }
  loadOrders();
}

let searchDebounce;
function searchOrders(q) {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    currentSearch = q.trim();
    currentPage = 1;
    loadOrders();
  }, 300);
}

async function updateStatus(id, status) {
  if (!status) return;
  try {
    await AdminAPI.put('/orders/' + id, { order_status: status });
    showToast(`Order status updated to ${status}.`, 'success');
    loadOrders();
  } catch (err) {
    showToast(err.message || 'Could not update status.', 'error');
  }
}

async function updatePaymentStatus(id, status) {
  if (!status) return;
  try {
    await AdminAPI.put('/orders/' + id, { payment_status: status });
    showToast(`Payment status updated to ${status}.`, 'success');
    loadOrders();
  } catch (err) {
    showToast(err.message || 'Could not update order status.', 'error');
    loadOrders(); // revert the dropdown to the real current state
  }
}

let orderCache = {};
async function viewOrder(id) {
  document.getElementById('orderModalTitle').textContent = 'Loading…';
  document.getElementById('orderModalBody').innerHTML = 'Loading…';
  openModal('orderModal');

  try {
    const res = await AdminAPI.get('/orders/' + id);
    const o = res.data;
    orderCache[id] = o;
    renderInvoice(o);
    document.getElementById('orderModalTitle').textContent = `Order ${o.order_number}`;

    const items = o.items || [];
    document.getElementById('orderModalBody').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div style="background:var(--surface);border-radius:10px;padding:1rem">
          <p style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.5rem">Customer</p>
          <p style="font-weight:700">${escapeHtml(o.first_name + ' ' + o.last_name)}</p>
          <p style="font-size:.78rem;color:var(--muted)">${escapeHtml(o.email)}</p>
        </div>
        <div style="background:var(--surface);border-radius:10px;padding:1rem">
          <p style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.5rem">Order Info</p>
          <p style="font-weight:700">${escapeHtml(o.order_number)}</p>
          <p style="font-size:.78rem;color:var(--muted)">${fmt.date(o.created_at)}</p>
        </div>
      </div>
      <div style="background:var(--surface);border-radius:10px;padding:1rem;margin-bottom:1rem">
        <p style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.75rem">Order Items (${items.length})</p>
        ${items.map(i => `<div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.82rem"><div><span style="font-weight:600">${escapeHtml(i.product_name)}</span> <span style="color:var(--muted)">× ${i.quantity}</span></div><span style="font-weight:700">${fmt.currency(i.item_total)}</span></div>`).join('')}
        <div style="display:flex;justify-content:space-between;margin-top:.75rem;font-weight:800;font-size:.9rem"><span>Total</span><span>${fmt.currency(o.total_amount)}</span></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div style="background:var(--surface);border-radius:10px;padding:1rem">
          <p style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.5rem">Payment</p>
          <p style="font-size:.82rem;font-weight:600">${escapeHtml(o.payment_method || '—')}</p>
          <span class="badge ${o.payment_status==='completed'?'badge-delivered':'badge-cancelled'}">${escapeHtml(o.payment_status || 'unknown')}</span>
          ${o.payment_proof_url ? `<div style="margin-top:.5rem"><a href="${escapeHtml(o.payment_proof_url)}" target="_blank" style="font-size:.75rem;color:var(--primary);text-decoration:underline">View Payment Screenshot</a></div>` : ''}
          <select class="form-control" style="margin-top:.5rem;height:30px;font-size:.75rem" onchange="updatePaymentStatus(${o.order_id}, this.value);this.value=''">
            <option value="">Update Payment…</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
            <option value="refunded">Refunded</option>
          </select>
        </div>
        <div style="background:var(--surface);border-radius:10px;padding:1rem">
          <p style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.5rem">Shipping</p>
          <span class="badge badge-${o.order_status}">${escapeHtml(o.order_status)}</span>
          ${o.tracking_number ? `<p style="font-size:.75rem;color:var(--muted);margin-top:.375rem">Tracking: ${escapeHtml(o.tracking_number)}</p>` : '<p style="font-size:.75rem;color:var(--muted);margin-top:.375rem">No tracking yet</p>'}
          <input type="text" class="form-control" placeholder="Add tracking #" style="margin-top:.5rem;height:30px;font-size:.75rem" onblur="if(this.value) addTracking(${o.order_id}, this.value)">
        </div>
      </div>`;
  } catch (err) {
    document.getElementById('orderModalTitle').textContent = 'Order Details';
    document.getElementById('orderModalBody').innerHTML = `<p style="color:var(--error)">Could not load order.</p>`;
  }
}

async function updatePaymentStatus(orderId, status) {
  if (!status) return;
  const o = orderCache[orderId];
  try {
    await AdminAPI.put('/orders/' + orderId, { payment_status: status });
    showToast('Payment status updated!', 'success');
    viewOrder(orderId); // refresh modal with the saved value
  } catch (err) {
    showToast(err.message || 'Could not update payment status.', 'error');
  }
}

async function addTracking(orderId, trackingNumber) {
  const o = orderCache[orderId];
  try {
    await AdminAPI.put('/orders/' + orderId, { order_status: o?.order_status || 'processing', tracking_number: trackingNumber });
    showToast('Tracking number added!', 'success');
    viewOrder(orderId); // refresh modal with the saved value
  } catch (err) {
    showToast(err.message || 'Could not save tracking number.', 'error');
  }
}

async function exportOrders() {
  try {
    const params = new URLSearchParams({ page: 1, limit: 100 });
    if (currentStatus !== 'all') params.set('status', currentStatus);
    if (currentSearch) params.set('search', currentSearch);
    const res = await AdminAPI.get('/orders?' + params.toString());
    const rows = res.data || [];
    if (!rows.length) {
      showToast('No orders match the current filters.', 'info');
      return;
    }

    const csvValue = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
    const header = ['Order Number', 'Customer', 'Email', 'Date', 'Items', 'Total', 'Payment', 'Status'];
    const lines = [header.map(csvValue).join(',')];
    rows.forEach(order => {
      lines.push([
        order.order_number,
        `${order.first_name || ''} ${order.last_name || ''}`.trim(),
        order.email,
        order.created_at,
        order.item_count,
        fmt.currency(order.total_amount),
        order.payment_method,
        order.order_status
      ].map(csvValue).join(','));
    });

    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `mithooos-orders-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    showToast(`${rows.length} order(s) exported.`, 'success');
  } catch (err) {
    showToast(err.message || 'Could not export orders.', 'error');
  }
}

  if (!document.getElementById('printInvoice').innerHTML.trim()) {
    showToast('Open an order before printing the invoice.', 'warning');
    return;
  }
  window.print();
