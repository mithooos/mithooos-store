<div class="main-wrap">
  <header class="topbar">
    <div class="topbar-left"><div class="page-title">Customers</div><div style="font-size:.75rem;color:var(--muted)">Manage customer accounts</div></div>
    <div class="topbar-right"><div class="admin-avatar">A</div></div>
  </header>

  <main class="content">
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card"><div class="stat-header"><span class="stat-label">Total Customers</span><div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div></div><div class="stat-val" id="statTotalCustomers">—</div></div>
      <div class="stat-card"><div class="stat-header"><span class="stat-label">New (30 days)</span><div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="20 6 9 17 4 12"/></svg></div></div><div class="stat-val" id="statNew30">—</div></div>
      <div class="stat-card"><div class="stat-header"><span class="stat-label">Avg. Order Value</span><div class="stat-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div></div><div class="stat-val" id="statAvgOrder">—</div></div>
      <div class="stat-card"><div class="stat-header"><span class="stat-label">Repeat Buyers</span><div class="stat-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg></div></div><div class="stat-val" id="statRepeatPct">—</div></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="toolbar-search"><svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" width="15" height="15"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="search" placeholder="Name, email, phone…" oninput="searchCustomers(this.value)"></div>
        <select class="form-control" style="width:130px;height:34px;font-size:.78rem" onchange="filterByActive(this.value)">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <select class="form-control" style="width:160px;height:34px;font-size:.78rem" id="sortSelect" onchange="sortCustomers(this.value)">
          <option value="newest">Sort: Newest First</option>
          <option value="orders">Sort: Most Orders</option>
          <option value="spend">Sort: Highest Spend</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Customer</th><th>Joined</th><th>Orders</th><th>Total Spent</th><th>Last Order</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="customersBody"></tbody>
        </table>

<!-- CUSTOMER DETAIL MODAL -->
<div class="modal-overlay" id="customerModal">
  <div class="modal" style="max-width:680px">
    <div class="modal-header"><span class="modal-title" id="custModalTitle">Customer Profile</span><button class="modal-close" onclick="closeModal('customerModal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body" id="custModalBody"></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('customerModal')">Close</button><button class="btn btn-primary" disabled title="Coming soon" style="opacity:.5;cursor:not-allowed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Send Email</button></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../js/admin.js?v=20260916"></script>
<script>
'use strict';

/* ══════════════════════════════════════════
   ADMIN CUSTOMERS — Wired to the real backend
   (GET/PUT /admin/customers via AdminAPI)
   ══════════════════════════════════════════ */

let currentPage = 1;
let currentSearch = '';
let currentActiveFilter = '';
let currentSort = 'newest';
let lastRows = [];
let searchDebounce;

async function loadCustomers() {
  const tbody = document.getElementById('customersBody');
  tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--muted)">Loading…</td></tr>`;

  const params = new URLSearchParams({ page: currentPage, limit: 20 });
  if (currentSearch) params.set('search', currentSearch);

  try {
    const res = await AdminAPI.get('/customers?' + params.toString());
    if (!res.success) throw new Error(res.message || 'Failed to load customers');
    lastRows = res.data || [];
    applyFiltersAndSort();
    renderPagination(res.pagination);
    updateStatCards(res.stats);
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--error)">Could not load customers.</td></tr>`;
    showToast(err.message || 'Could not load customers.', 'error');
  }
}

// Re-sort/re-filter the already-fetched page client-side — the backend's
// customer list has a fixed ORDER BY created_at and no alternate sort
// modes, so "Most Orders" / "Highest Spend" only reorders what's already
// on the current page rather than issuing a new server-side query.
function applyFiltersAndSort() {
  let rows = [...lastRows];
  if (currentActiveFilter) rows = rows.filter(c => String(parseInt(c.is_active, 10)) === currentActiveFilter);
  if (currentSort === 'orders') rows.sort((a, b) => b.order_count - a.order_count);
  else if (currentSort === 'spend') rows.sort((a, b) => parseFloat(b.total_spent) - parseFloat(a.total_spent));
  renderCustomers(rows);
}

function sortCustomers(val) {
  currentSort = val;
  applyFiltersAndSort();
}

function updateStatCards(stats) {
  if (!stats) return;
  document.getElementById('statTotalCustomers').textContent = fmt.num(stats.total_customers);
  document.getElementById('statNew30').textContent = fmt.num(stats.new_last_30_days);
  document.getElementById('statAvgOrder').textContent = fmt.currency(stats.avg_order_value);
  document.getElementById('statRepeatPct').textContent = stats.repeat_buyer_pct + '%';
}

function renderCustomers(rows) {
  const tbody = document.getElementById('customersBody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--muted)">No customers found.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(c => {
    const initial = (c.first_name || '?').charAt(0).toUpperCase();
    const isActive = !!parseInt(c.is_active, 10);
    return `<tr>
      <td>
        <div style="display:flex;align-items:center;gap:.625rem">
          <div class="td-img" style="border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:.8rem">${escapeHtml(initial)}</div>
          <div>
            <div class="td-name">${escapeHtml(c.first_name + ' ' + c.last_name)}</div>
            <div class="td-muted">${escapeHtml(c.email)}</div>
          </div>
        </div>
      </td>
      <td style="font-size:.78rem">${fmt.date(c.created_at)}</td>
      <td style="text-align:center;font-weight:600">${c.order_count}</td>
      <td style="font-weight:700">${fmt.currency(c.total_spent)}</td>
      <td style="font-size:.78rem">${c.last_login ? fmt.date(c.last_login) : '—'}</td>
      <td>${isActive ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-inactive">Inactive</span>'}</td>
      <td>
        <div class="td-actions">
          <button class="btn btn-outline btn-sm" onclick="viewCustomer(${c.user_id})">Profile</button>
          <button class="btn ${isActive?'btn-danger':'btn-success'} btn-sm" onclick="toggleActive(${c.user_id}, ${isActive})">${isActive?'Deactivate':'Activate'}</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function renderPagination(pagination) {
  const el = document.getElementById('pagination');
  if (!el || !pagination) return;
  const { current_page, last_page } = pagination;
  if (last_page <= 1) { el.innerHTML = ''; return; }
  let html = `<button class="btn btn-ghost btn-sm" ${current_page<=1?'disabled':''} onclick="goToPage(${current_page-1})">Prev</button>`;
  html += `<span style="font-size:.78rem;padding:0 .75rem;color:var(--muted)">Page ${current_page} of ${last_page}</span>`;
  html += `<button class="btn btn-ghost btn-sm" ${current_page>=last_page?'disabled':''} onclick="goToPage(${current_page+1})">Next</button>`;
  el.innerHTML = html;
}
function goToPage(p) { if (p < 1) return; currentPage = p; loadCustomers(); }

function searchCustomers(q) {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    currentSearch = q.trim();
    currentPage = 1;
    loadCustomers();
  }, 300);
}

function filterByActive(val) {
  currentActiveFilter = val === 'active' ? '1' : val === 'inactive' ? '0' : '';
  applyFiltersAndSort();
}

async function toggleActive(id, currentlyActive) {
  const action = currentlyActive ? 'deactivate' : 'activate';
  if (!confirm(`Are you sure you want to ${action} this customer's account?`)) return;
  try {
    await AdminAPI.put('/customers/' + id, { is_active: currentlyActive ? 0 : 1 });
    showToast(`Customer ${action}d.`, 'success');
    loadCustomers();
  } catch (err) {
    showToast(err.message || `Could not ${action} customer.`, 'error');
  }
}

async function viewCustomer(id) {
  document.getElementById('custModalTitle').textContent = 'Loading…';
  document.getElementById('custModalBody').innerHTML = 'Loading…';
  openModal('customerModal');

  try {
    const res = await AdminAPI.get('/customers/' + id);
    const c = res.data;
    document.getElementById('custModalTitle').textContent = `${c.first_name} ${c.last_name}`;

    const orders = c.recent_orders || [];
    document.getElementById('custModalBody').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div style="background:var(--surface);border-radius:10px;padding:1rem">
          <p style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.5rem">Contact</p>
          <p style="font-weight:600;font-size:.85rem">${escapeHtml(c.email)}</p>
          <p style="font-size:.8rem;color:var(--muted)">${escapeHtml(c.phone || 'No phone on file')}</p>
        </div>
        <div style="background:var(--surface);border-radius:10px;padding:1rem">
          <p style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.5rem">Lifetime Value</p>
          <p style="font-weight:800;font-size:1.1rem">${fmt.currency(c.total_spent)}</p>
          <p style="font-size:.78rem;color:var(--muted)">${c.order_count} order${c.order_count !== 1 ? 's' : ''}</p>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div><p style="font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem">Joined</p><p style="font-size:.82rem">${fmt.date(c.created_at)}</p></div>
        <div><p style="font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem">Last Login</p><p style="font-size:.82rem">${c.last_login ? fmt.date(c.last_login) : 'Never'}</p></div>
        <div><p style="font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem">Status</p>${parseInt(c.is_active,10) ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-inactive">Inactive</span>'}</div>
        <div><p style="font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem">Verified</p>${parseInt(c.is_verified,10) ? '<span class="badge badge-delivered">Verified</span>' : '<span class="badge badge-cancelled">Unverified</span>'}</div>
      </div>
      <p style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.5rem">Recent Orders</p>
      ${orders.length ? orders.map(o => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.82rem">
          <span style="font-weight:600">${escapeHtml(o.order_number)}</span>
          <span class="badge badge-${o.order_status}">${escapeHtml(o.order_status)}</span>
          <span style="font-weight:700">${fmt.currency(o.total_amount)}</span>
        </div>`).join('') : '<p style="font-size:.8rem;color:var(--muted)">No orders yet.</p>'}
    `;
  } catch (err) {
    document.getElementById('custModalTitle').textContent = 'Customer Profile';
    document.getElementById('custModalBody').innerHTML = `<p style="color:var(--error)">Could not load customer.</p>`;
  }
}

loadCustomers();
</script>
</body>
